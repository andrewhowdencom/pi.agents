site_name: Pi Agents
site_url: https://andrewhowdencom.github.io/pi.agents/
repo_url: https://github.com/andrewhowdencom/pi.agents
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

nav:
  - Home: index.md
  - Tutorial:
    - Getting Started: tutorial/getting-started.md
  - How-To Guides:
    - Install the Extension: how-to/install.md
    - Switch Between Agents: how-to/switch-agents.md
    - Create a Workflow: how-to/create-workflow.md
  - Reference:
    - Commands and Tools: reference/commands.md
    - Workflow YAML: reference/workflow-yaml.md
    - Subagent Frontmatter: reference/subagent-frontmatter.md
  - Explanation:
    - Architecture: explanation/architecture.md

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
